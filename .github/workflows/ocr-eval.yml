# ZK-120: which on-device OCR engine reads Ukrainian screenshots best. Runs the committed set
# (tools/ocr-eval/set) through each candidate and scores them; the table lands in the job summary
# and the «ocr-eval» artifact. Manual, or on changes to the evaluation itself.
name: ocr-eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ocr-eval/**"
      - "tools/ocr-helper/**"
      - ".github/workflows/ocr-eval.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract (ukr + eng)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng
          tesseract --version | head -1
          pip install -q pillow
          python tools/ocr-eval/run_engine.py tesseract out/tesseract.json
          python tools/ocr-eval/run_engine.py tesseract-2x out/tesseract-2x.json
      - name: Tesseract model variants (fast / best, pinned 4.1.0) and the dual pass
        run: |
          get() {  # repo lang sha256
            mkdir -p "models/$1"
            curl -sfL -o "models/$1/$2.traineddata" "https://github.com/tesseract-ocr/$1/raw/4.1.0/$2.traineddata"
            echo "$3  models/$1/$2.traineddata" | sha256sum -c -
          }
          get tessdata_fast ukr d59e53e2bded32f4445f124b4b00240fcac7e8044c003ab822ccb94f0b3db59b
          get tessdata_fast eng 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          get tessdata_best ukr 1277f6e3b6f707063a92d40e7678e7f57154e8414e328e340be9ee9275eea9c8
          get tessdata_best eng 8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba
          export TESSDATA_FAST="$PWD/models/tessdata_fast" TESSDATA_BEST="$PWD/models/tessdata_best"
          for e in tesseract-2x-dual tesseract-fast-2x tesseract-fast-2x-dual tesseract-best-2x tesseract-best-2x-dual tesseract-best-2x-words tesseract-best-2x-engfirst; do
            python tools/ocr-eval/run_engine.py "$e" "out/$e.json"
          done
      - name: EasyOCR (uk + en, CPU)
        continue-on-error: true
        run: |
          pip install -q easyocr
          python tools/ocr-eval/run_engine.py easyocr out/easyocr.json
      - name: PaddleOCR (PP-OCRv5, East Slavic)
        continue-on-error: true
        run: |
          pip install -q paddlepaddle paddleocr
          python tools/ocr-eval/run_engine.py paddle out/paddle.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-linux
          path: out/*.json

  memory:
    # ZK-120 step 3: peak RAM and time per model set and screen size (RAM matters more than the
    # installer's size — owner, 29.09).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract memory
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr time
          pip install -q pillow
          get() {  # repo lang sha256
            mkdir -p "models/$1"
            curl -sfL -o "models/$1/$2.traineddata" "https://github.com/tesseract-ocr/$1/raw/4.1.0/$2.traineddata"
            echo "$3  models/$1/$2.traineddata" | sha256sum -c -
          }
          get tessdata_fast ukr d59e53e2bded32f4445f124b4b00240fcac7e8044c003ab822ccb94f0b3db59b
          get tessdata_fast eng 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          get tessdata_best ukr 1277f6e3b6f707063a92d40e7678e7f57154e8414e328e340be9ee9275eea9c8
          get tessdata_best eng 8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba
          export TESSDATA_FAST="$PWD/models/tessdata_fast" TESSDATA_BEST="$PWD/models/tessdata_best"
          nproc; tesseract --version | head -1
          python tools/ocr-eval/memory.py | tee memory.md
          cat memory.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-memory
          path: memory.md

  helper:
    # ZK-120: our own helper (tools/ocr-helper) — Tesseract 5.5.3 + Leptonica 1.87 from pinned
    # sources, integer models converted from tessdata_best (byte-identical to lstmtraining), run
    # over the set through its stdin protocol, plus memory and time on full screens.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: target/ocr-helper-work
          key: ocr-helper-${{ hashFiles('tools/ocr-helper/build.py') }}
      - name: build znimok-ocr.exe
        run: python tools/ocr-helper/build.py
      - name: run over the set and on full screens
        shell: pwsh
        run: |
          pip install -q pillow
          $exe = (Resolve-Path target/ocr-helper/znimok-ocr.exe).Path
          & $exe --version
          python tools/ocr-eval/run_helper.py $exe out/znimok-ocr.json
          python tools/ocr-eval/run_helper.py $exe out/znimok-ocr-mask.json --mode 1
          python tools/ocr-eval/run_helper.py $exe --screens | Tee-Object helper-memory.md
          Get-Content helper-memory.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: the Rust client against the helper
        shell: pwsh
        run: |
          $env:ZNIMOK_OCR_HELPER = (Resolve-Path target/ocr-helper/znimok-ocr.exe).Path
          cargo test -p znimok-models --test ocr_helper
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-helper
          path: |
            out/*.json
            helper-memory.md

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Apple Vision (reference)
        run: |
          mkdir -p out
          swift tools/ocr-eval/vision.swift tools/ocr-eval/set out/vision.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-macos
          path: out/*.json

  score:
    needs: [linux, macos, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: score
        run: |
          python3 tools/ocr-eval/score.py in/*/*.json in/*/out/*.json | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-eval
          path: |
            report.md
            in/*/*.json
