# Release (ZK-79): a tag v* builds Windows and macOS, the SBOM and the MCP bundle, writes
# SHA256SUMS, signs it when the signing key is set up, and creates a DRAFT GitHub release — the
# owner reviews and publishes it (docs/RELEASE.md). `workflow_dispatch` runs the same without
# a release: everything lands in the «release-preview» artifact.
name: release

on:
  push:
    tags: ["v*"]
  # The pipeline checks itself when it changes (preview only, no release).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "crates/znimok-thumbnail/mac/**"
      - "tools/ocr-helper/**"
      - "crates/znimok-thumbnail/icons/**"
      - "crates/znimok-update/**"
      - "tools/verify_release.py"
      - "tools/sparkle_appcast.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: version from the tag, checked against Cargo.toml
        run: |
          ws=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$ws" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $ws (Cargo.toml)"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$ws-preview.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-2025
    env:
      # A standalone exe: no VC++ Redistributable needed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-audit
      - name: build (dependency list embedded)
        run: cargo auditable build --release --locked -p znimok-app -p znimok-cli -p znimok-thumbnail
      - uses: actions/cache@v4
        with:
          path: target/ocr-helper-work
          key: ocr-helper-${{ hashFiles('tools/ocr-helper/build.py') }}
      - name: text recognition helper (ZK-120; Tesseract from pinned sources, integer models)
        run: python tools/ocr-helper/build.py
      - name: audit the binaries
        run: |
          cargo audit bin target/release/znimok-app.exe
          cargo audit bin target/release/znimok.exe
      - name: package
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $dir = "dist/Znimok-$v-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/znimok-app.exe, target/release/znimok.exe, target/release/znimok_thumbnail.dll, LICENSE, README.md, README.en.md $dir
          Copy-Item target/ocr-helper/znimok-ocr.exe $dir
          Copy-Item target/ocr-helper/NOTICE.txt "$dir/NOTICE-ocr.txt"
          Copy-Item -Recurse target/ocr-helper/tessdata $dir
          New-Item -ItemType Directory -Force "$dir/icons" | Out-Null
          Copy-Item crates/znimok-thumbnail/icons/doc-*.ico "$dir/icons"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/Znimok-$v-windows-x64.zip"
          Copy-Item target/release/znimok.exe dist/znimok.exe
      - name: MSI (WiX, per-user)
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $msiVersion = ($v -split '-')[0]          # MSI takes only numbers
          # WiX 5 (MS-RL): v6 needs accepting an extra EULA (the maintenance-fee terms) — not done on the owner's behalf.
          dotnet tool install --global wix --version 5.0.2
          $bin = "msi-bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item target/release/znimok-app.exe, target/release/znimok.exe, target/release/znimok_thumbnail.dll, LICENSE $bin
          Copy-Item target/ocr-helper/znimok-ocr.exe $bin
          Copy-Item target/ocr-helper/NOTICE.txt "$bin/NOTICE-ocr.txt"
          Copy-Item -Recurse target/ocr-helper/tessdata $bin
          New-Item -ItemType Directory -Force "$bin/icons" | Out-Null
          Copy-Item crates/znimok-thumbnail/icons/doc-*.ico "$bin/icons"
          wix build packaging/msi/znimok.wxs -arch x64 -d Version=$msiVersion -d Bin=$bin -o "dist/Znimok-$v-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
      - name: MSI installs, registers and uninstalls cleanly
        shell: pwsh
        run: |
          $msi = (Get-Item dist/*.msi).FullName
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Znimok"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          foreach ($f in "znimok-app.exe", "znimok.exe", "znimok_thumbnail.dll", "LICENSE.txt", "znimok-ocr.exe", "NOTICE-ocr.txt", "tessdata\ukr.traineddata", "tessdata\eng.traineddata", "icons\doc-image.ico", "icons\doc-video.ico", "icons\doc-report.ico") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $assoc = (Get-ItemProperty "HKCU:\Software\Classes\.znimok").'(default)'
          if ($assoc -ne "Znimok.Document") { throw ".znimok is '$assoc'" }
          $thumb = (Get-ItemProperty "HKCU:\Software\Classes\.znimok\ShellEx\{e357fccd-a995-4576-b01f-234630154e96}").'(default)'
          if ($thumb -ne "{787777D8-E076-4FDC-8065-F7282E5D3F86}") { throw "thumbnail handler is '$thumb'" }
          $ih = (Get-ItemProperty "HKCU:\Software\Classes\Znimok.Document\shellex\IconHandler").'(default)'
          if ($ih -ne "{0F5C6E12-2A39-4AAC-9C34-3E2C9305E05A}") { throw "icon handler is '$ih'" }
          $di = (Get-ItemProperty "HKCU:\Software\Classes\Znimok.Document\DefaultIcon").'(default)'
          if ($di -ne "%1") { throw "DefaultIcon is '$di' (the icon handler needs %1)" }
          $path = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($path -notlike "*$dir*") { throw "the install folder is not on the user PATH" }
          & (Join-Path $dir "znimok.exe") --version
          & (Join-Path $dir "znimok-ocr.exe") --version
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir "znimok-app.exe")) { throw "files left after uninstall" }
          if (Test-Path "HKCU:\Software\Classes\Znimok.Document") { throw "ProgID left after uninstall" }
          $path = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($path -like "*$dir*") { throw "PATH entry left after uninstall" }
          "install → check → uninstall: clean"
      - name: update installs, confirms the start, and goes back when the new version does not start (ZK-122)
        shell: pwsh
        run: |
          # Three MSIs of the same files with different versions: 0.0.1 → 0.0.2 (confirms) → 0.0.3 (silent → back to 0.0.2).
          $bin = "msi-bin"
          foreach ($ver in "0.0.1", "0.0.2", "0.0.3") {
            wix build packaging/msi/znimok.wxs -arch x64 -d Version=$ver -d Bin=$bin -o "upd/Znimok-$ver-windows-x64.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix build $ver failed" }
          }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Znimok"
          $updates = Join-Path $env:LOCALAPPDATA "Znimok\Updates"
          function Installed-Version {
            (Get-ItemProperty "HKCU:\Software\Znimok\Installed" -ErrorAction SilentlyContinue).version
          }
          function Wait-Outcome([string]$want) {
            $f = Join-Path $updates "last-outcome.txt"
            for ($i = 0; $i -lt 240; $i++) {
              if ((Test-Path $f) -and ((Get-Content $f -Raw) -like "*$want*")) { return (Get-Content $f -Raw) }
              Start-Sleep -Milliseconds 500
            }
            throw "no outcome «$want»: $(if (Test-Path $f) { Get-Content $f -Raw })"
          }
          $p = Start-Process msiexec -ArgumentList "/i `"$((Resolve-Path upd/Znimok-0.0.1-windows-x64.msi).Path)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "0.0.1 install: $($p.ExitCode)" }
          if ((Installed-Version) -ne "0.0.1") { throw "installed: $(Installed-Version)" }
          New-Item -ItemType Directory -Force (Join-Path $updates "installed") | Out-Null
          Copy-Item upd/Znimok-0.0.1-windows-x64.msi (Join-Path $updates "installed")
          $cli = Join-Path $dir "znimok.exe"

          # 1) 0.0.2: the started "app" confirms its version → installed.
          Copy-Item upd/Znimok-0.0.2-windows-x64.msi $updates
          & $cli update install --msi (Join-Path $updates "Znimok-0.0.2-windows-x64.msi") --version 0.0.2 `
            --app $cli --app-arg update --app-arg mark-started --app-arg 0.0.2
          # The note is JSON since ZK-211: {"kind":"installed","version":"0.0.2","time_ms":…}.
          $o = Wait-Outcome '"kind":"installed","time_ms":*,"version":"0.0.2"'; "outcome: $o"
          if ((Installed-Version) -ne "0.0.2") { throw "after the update: $(Installed-Version)" }
          if (-not (Test-Path (Join-Path $updates "installed\Znimok-0.0.2-windows-x64.msi"))) { throw "0.0.2 not kept for a way back" }

          # 2) 0.0.3: the "app" confirms another version → no start signal → back to 0.0.2.
          Remove-Item (Join-Path $updates "last-outcome.txt")
          Copy-Item upd/Znimok-0.0.3-windows-x64.msi $updates
          & $cli update install --msi (Join-Path $updates "Znimok-0.0.3-windows-x64.msi") --version 0.0.3 `
            --app $cli --app-arg update --app-arg mark-started --app-arg 9.9.9
          $o = Wait-Outcome '"kind":"rolled_back"'; "outcome: $o"
          if ((Installed-Version) -ne "0.0.2") { throw "after the way back: $(Installed-Version)" }

          # 3) An installer outside the updates folder is refused.
          & $cli update install --msi (Resolve-Path upd/Znimok-0.0.3-windows-x64.msi).Path --version 0.0.3 --as-runner
          if ($LASTEXITCODE -eq 0) { throw "an installer outside the updates folder was accepted" }

          $p = Start-Process msiexec -ArgumentList "/x `"$((Resolve-Path upd/Znimok-0.0.2-windows-x64.msi).Path)`" /qn" -Wait -PassThru
          "update: 0.0.1 → 0.0.2 installed; 0.0.3 did not start → 0.0.2 back; foreign path refused"
          # The refused install above left exit code 3; the step itself succeeded.
          $global:LASTEXITCODE = 0
      - name: winget manifest (ZK-81) is valid
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          python packaging/stores/make_manifests.py --version $v --files dist --dest stores --only winget
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "stores/winget/manifests/v/VPlum/Znimok/$v"
            if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }
          } else {
            "::notice::winget is not on this runner — the manifest was generated, not validated"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/znimok.exe
          retention-days: 14

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-audit
      - name: build (dependency list embedded)
        run: cargo auditable build --release --locked -p znimok-app -p znimok-cli
      - name: audit the binaries
        run: |
          cargo audit bin target/release/znimok-app
          cargo audit bin target/release/znimok
      - name: Signing identity (self-signed, ZK-183) — the permissions survive updates
        env:
          P12: ${{ secrets.ZNIMOK_MAC_CERT_P12 }}
          PASS: ${{ secrets.ZNIMOK_MAC_CERT_PASS }}
        run: |
          # TCC (Screen Recording, Microphone) and the Keychain remember the app by its designated
          # requirement: with an ad-hoc signature it changes with every build, with one stable
          # certificate it does not. Gatekeeper still asks on first start (notarisation, ZK-80).
          if [[ -z "$P12" || -z "$PASS" ]]; then
            echo "::warning::ZNIMOK_MAC_CERT_P12 is not set — ad-hoc signature, macOS permissions reset with each update (ZK-183)"
            echo "ZNIMOK_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/znimok-sign.keychain-db"
          kp="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$PASS" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/id.p12"
          echo "ZNIMOK_SIGN_IDENTITY=Znimok (self-signed)" >> "$GITHUB_ENV"
      - name: Quick Look thumbnails (ZnimokThumbnail.appex, ZK-76)
        run: bash crates/znimok-thumbnail/mac/build-appex.sh target/appex "${{ needs.version.outputs.version }}"
      - name: Znimok.app (self-signed, ZK-183; Developer ID and notarisation come with ZK-80)
        env:
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          v="${{ needs.version.outputs.version }}"
          app="dist/Znimok.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/PlugIns"
          cp target/release/znimok-app target/release/znimok "$app/Contents/MacOS/"
          cp -R target/appex/ZnimokThumbnail.appex "$app/Contents/PlugIns/"
          # The .znimok document icon (ZK-150), named by the document type in Info.plist.
          cp crates/znimok-thumbnail/icons/ZnimokDocument.icns "$app/Contents/Resources/"
          cp crates/znimok-app/icons/Znimok.icns "$app/Contents/Resources/"
          # Sparkle 2 (ZK-143): the framework of the pinned release, as published (its own
          # signatures stay valid; re-signing comes with Developer ID, ZK-80). Loaded at run time
          # from Contents/Frameworks — no link step.
          curl -sSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" "$app/Contents/Frameworks"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" Sparkle.framework
          ditto "$RUNNER_TEMP/sparkle/Sparkle.framework" "$app/Contents/Frameworks/Sparkle.framework"
          codesign --verify --strict "$app/Contents/Frameworks/Sparkle.framework"
          # CFBundleVersion is what Sparkle compares with the appcast: the version itself.
          sed -e "s/@BUILD@/$v/" \
              -e "s#<key>CFBundleShortVersionString</key><string>[^<]*</string>#<key>CFBundleShortVersionString</key><string>$v</string>#" \
              crates/znimok-app/mac/Info.plist > "$app/Contents/Info.plist"
          # The document type (ZK-75): exported UTI + document type, unless the app's plist has them.
          python3 - "$app/Contents/Info.plist" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "UTExportedTypeDeclarations" not in s:
              frag = open("crates/znimok-mac/assoc/document-types.plist").read().split("-->", 1)[1]
              i = s.rindex("</dict>")
              s = s[:i] + frag + s[i:]
              open(p, "w").write(s)
          PY
          plutil -lint "$app/Contents/Info.plist"
          # The extension keeps its own signature (sandbox entitlement): no --deep here.
          codesign --force --sign "$ZNIMOK_SIGN_IDENTITY" --identifier ua.plum.znimok.app "$app"
          codesign --verify --strict "$app"
          codesign -d -r- "$app" 2>&1 | tail -1
          codesign -d --entitlements - "$app/Contents/PlugIns/ZnimokThumbnail.appex" | grep -q app-sandbox
          (cd dist && ditto -c -k --keepParent Znimok.app "Znimok-$v-macos-arm64.zip")
          cp target/release/znimok dist/znimok
      - name: DMG
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dmg && cp -R dist/Znimok.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Znimok $v" -srcfolder dmg -ov -format UDZO "dist/Znimok-$v-macos-arm64.dmg"
          hdiutil verify "dist/Znimok-$v-macos-arm64.dmg"
      - name: appcast (Sparkle, ZK-143) — the DMG signed with the Ed25519 key
        env:
          ZNIMOK_SPARKLE_KEY: ${{ secrets.ZNIMOK_SPARKLE_KEY }}
        run: |
          v="${{ needs.version.outputs.version }}"
          if [[ -z "$ZNIMOK_SPARKLE_KEY" ]]; then
            echo "::warning::ZNIMOK_SPARKLE_KEY is not set — no appcast, macOS updates stay off (ZK-111)"
            exit 0
          fi
          python3 tools/sparkle_appcast.py sign --file "dist/Znimok-$v-macos-arm64.dmg" --version "$v" \
            --url "https://github.com/V-Plum/znimok/releases/download/$GITHUB_REF_NAME/Znimok-$v-macos-arm64.dmg" \
            --notes "https://github.com/V-Plum/znimok/releases/tag/$GITHUB_REF_NAME" --out dist/appcast.xml
          python3 tools/sparkle_appcast.py verify --appcast dist/appcast.xml --file "dist/Znimok-$v-macos-arm64.dmg"
      - name: Homebrew cask (ZK-81) — style, audit, install, uninstall
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p stores-in && cp "dist/Znimok-$v-macos-arm64.dmg" stores-in/
          python3 packaging/stores/make_manifests.py --version "$v" --files stores-in --dest stores --only homebrew
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew tap-new --no-git local/znimok
          tap="$(brew --repository)/Library/Taps/local/homebrew-znimok"
          mkdir -p "$tap/Casks" && cp stores/homebrew/Casks/znimok.rb "$tap/Casks/"
          brew style "$tap/Casks/znimok.rb"
          brew audit --cask --strict local/znimok/znimok
          # The release URL does not exist yet: install the same cask from the DMG built above.
          sed -i '' "s#^  url .*#  url \"file://$PWD/stores-in/Znimok-$v-macos-arm64.dmg\"#" "$tap/Casks/znimok.rb"
          brew install --cask --appdir="$RUNNER_TEMP/Apps" local/znimok/znimok
          # Ad-hoc signed until ZK-80: take the download quarantine off before running the CLI.
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/Apps/Znimok.app" || true
          "$(brew --prefix)/bin/znimok" --version
          brew uninstall --cask --zap local/znimok/znimok
          [[ ! -e "$RUNNER_TEMP/Apps/Znimok.app" && ! -e "$(brew --prefix)/bin/znimok" ]]
          brew untap local/znimok
          echo "cask: style → audit → install → uninstall: clean"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/appcast.xml
            dist/znimok
          retention-days: 14

  mcpb:
    needs: [version, windows, macos]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: MCP bundle for Claude Desktop (tool list read from the binary)
        run: |
          chmod +x in/macos/znimok
          python3 packaging/mcpb/pack.py --win in/windows/znimok.exe --mac in/macos/znimok \
            --out "dist/znimok-${{ needs.version.outputs.version }}.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb
          retention-days: 14

  sbom:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: SBOM (CycloneDX, every crate, every target)
        run: |
          cargo cyclonedx --format json --target all
          mkdir -p dist
          find crates -name '*.cdx.json' -exec cp {} dist/ \;
          (cd dist && zip -q "../znimok-${{ needs.version.outputs.version }}-sbom-cyclonedx.zip" *.cdx.json)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: znimok-*-sbom-cyclonedx.zip
          retention-days: 14

  release:
    needs: [version, windows, macos, mcpb, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: collect, checksum, sign
        env:
          SIGNING_KEY: ${{ secrets.ZNIMOK_SIGNING_KEY }}
        run: |
          mkdir -p out
          cp in/windows/*.zip in/windows/*.msi in/macos/*.zip in/macos/*.dmg in/mcpb/*.mcpb in/sbom/*.zip out/
          cp in/macos/appcast.xml out/ 2>/dev/null || true
          # The browser extension of the DevTools log (ZK-97), to load unpacked until the store has it.
          (cd extension && zip -q -r "../out/znimok-extension-${{ needs.version.outputs.version }}.zip" .)
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          pub=../keys/znimok-release-p256.pub.pem
          if [[ -n "$SIGNING_KEY" ]]; then
            [[ -f "$pub" ]] || { echo "::error::signing key set but $pub is not committed"; exit 1; }
            printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/k.pem"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/k.pem" -out SHA256SUMS.sig SHA256SUMS
            rm "$RUNNER_TEMP/k.pem"
            openssl dgst -sha256 -verify "$pub" -signature SHA256SUMS.sig SHA256SUMS
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ZNIMOK_SIGNING_KEY is not set — the release is not signed (ZK-111)"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi
      - name: notes
        run: |
          {
            echo "Znimok ${{ needs.version.outputs.version }}"
            echo
            echo "- Windows: Znimok-…-windows-x64.msi — installs for the current user, no admin rights (Start menu, .znimok files, Explorer thumbnails, \`znimok\` on PATH). The .zip is the same without installing."
            echo "- macOS (Apple silicon): Znimok-…-macos-arm64.dmg (or .zip) — ad-hoc signed, not notarised: open with right-click → Open. Finder thumbnails included. Updates itself through Sparkle (appcast.xml, EdDSA-signed)."
            echo "- Claude Desktop: znimok-….mcpb. SBOM: …-sbom-cyclonedx.zip. Binaries carry their dependency list (cargo auditable)."
            echo "- Browser extension (the DevTools log of a recording, Chrome / Edge): znimok-extension-….zip — until it is in the Chrome Web Store: unzip, open chrome://extensions, turn on Developer mode, Load unpacked."
            if [[ "$SIGNED" == "1" ]]; then
              echo "- Signed: SHA256SUMS.sig (ECDSA P-256, keys/znimok-release-p256.pub.pem). Check: python tools/verify_release.py <tag>."
            else
              echo "- **Not signed** (the signing key is not set up yet). Check the checksums: python tools/verify_release.py <tag>."
            fi
          } > notes.md
          cat notes.md
      - name: winget manifests and Homebrew cask (ZK-81; submitted by hand, docs/RELEASE.md)
        run: python3 packaging/stores/make_manifests.py --version "${{ needs.version.outputs.version }}" --files out --dest stores
      - uses: actions/upload-artifact@v4
        with:
          name: store-manifests
          path: stores/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            out/*
            notes.md
          retention-days: 14
      - name: draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "Znimok ${{ needs.version.outputs.version }}" \
            --notes-file notes.md
