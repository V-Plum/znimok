[package]
name = "znimok-update"
description = "Znimok's update check (ZK-122): the latest GitHub release, version rules (never older), SHA256SUMS verified with the committed ECDSA P-256 key through the OS crypto before any installer is touched, then the installer's SHA-256"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
znimok-models = { path = "../znimok-models" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }
