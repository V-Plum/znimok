<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f7;--panel:#fff;--soft:#f0f2f6;--line:#dde0e7;--fg:#15171c;--fg2:#3d424d;--muted:#6a707d;--accent:#2f6fed;--sel:#dfe9ff;
--err:#d0343a;--warn:#a86400;--dl:#7446d8;--nav:#2f6fed;--net:#5a606d;--click:#b98700;--ok:#1f8a4c;--mono:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;--ar:calc({{VW}} / {{VH}});
--w2:max(360px,26vw);--w3:max(380px,30vw);--h2:50%}
@media (prefers-color-scheme:dark){:root{--bg:#0e1014;--panel:#16191f;--soft:#1d2129;--line:#2a2f39;--fg:#e9ebef;--fg2:#c3c7cf;--muted:#8f96a3;--accent:#74a2ff;--sel:#223355;
--err:#ff6b70;--warn:#f0a431;--dl:#ae7bff;--nav:#74a2ff;--net:#9aa1ad;--click:#f2c230;--ok:#4cc27d}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.top{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:10px 14px 8px}
h1{font-size:16px;margin:0;font-weight:650;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:12px;flex:1;min-width:0}
.meta b{color:var(--fg2);font-weight:600}
.masked{color:var(--warn)}
.dl{display:flex;gap:12px;font-size:12px;margin-left:auto}
.dl a{color:var(--accent);cursor:pointer}
main{display:grid;gap:10px;padding:0 14px;min-height:0;grid-template-columns:minmax(0,1fr) var(--w2) var(--w3)}
.gut{position:absolute;z-index:2;left:-8px;top:0;bottom:0;width:12px;cursor:col-resize;touch-action:none}
.pane{position:relative}
.fold .log,.fold .det,.nodet .det{display:none}
.fold main,.nodet main{grid-template-columns:minmax(0,1fr) var(--w2)}
.fold main{grid-template-columns:minmax(0,1fr)}
.unfold{position:fixed;right:14px;bottom:36px;z-index:3;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;box-shadow:0 2px 8px #0003}
.fold .unfold,.nodet .unfold{display:block}
.stage{container-type:size;display:grid;place-items:start center;min-height:0;min-width:0}
.fit{display:grid;gap:8px;width:min(100cqw,calc((100cqh - 38px) * var(--ar)))}
.v{position:relative;line-height:0;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:var(--ar)}
video{width:100%;height:100%;display:block}
.m{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.tl{position:relative;height:30px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;touch-action:none}
.tk{position:absolute;top:6px;width:2px;height:16px;margin-left:-1px;background:currentColor;opacity:.8;border-radius:1px}
.tk.c5{top:10px;width:8px;height:8px;margin-left:-4px;border-radius:4px;opacity:1}
.ph,.sm{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none}
.sm{width:10px;margin-left:-5px;background:var(--accent);opacity:.28;display:none}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.bar input{flex:0 0 150px;min-width:0;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chip{flex:none;border-radius:11px;padding:2px 9px;background:var(--soft);color:var(--fg2);font-weight:600;font-size:12px;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-left:5px}
.chip.on{background:var(--sel);color:var(--fg)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain;padding:2px 0}
.row{display:grid;grid-template-columns:50px 74px minmax(0,1fr) auto;gap:8px;padding:0 10px 0 7px;height:26px;align-items:center;cursor:pointer;border-left:3px solid transparent;outline-offset:-2px}
.row>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:var(--soft)}
.row.fut{color:var(--muted)}
.row.fut .kd,.row.fut .msg{opacity:.62}
.row.cur{border-left-color:var(--accent)}
.row.sel,.row.sel:hover{background:var(--sel)}
.tm{font:11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row.cur .tm{color:var(--accent)}
.kd{font-size:11.5px;font-weight:650}
.msg i,.ttl i{font-style:normal;color:var(--muted);margin-left:8px}
.src{font-size:11.5px;color:var(--muted);max-width:120px}
.c4{color:var(--err)}.c3{color:var(--warn)}.c2{color:var(--dl)}.c1{color:var(--nav)}.c0{color:var(--net)}.c5{color:var(--click)}
.empty{padding:18px 14px;color:var(--muted);text-align:center;margin:auto}
.dhead{display:flex;gap:8px;align-items:center;padding:0 6px 0 10px;height:41px;border-bottom:1px solid var(--line);flex:none}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ib{flex:none;min-width:28px;height:28px;padding:0 7px;border-radius:7px;color:var(--fg2);font-size:12px}
.ib:hover{background:var(--soft)}
.back{display:none}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{flex:none;color:var(--muted);padding:4px 9px 6px;font-weight:600;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab:disabled{opacity:.4;cursor:default}
.body{flex:1;overflow:auto;min-height:0;padding:10px 12px;overscroll-behavior:contain}
.body h3{margin:12px 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
.body h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:min(38%,190px) minmax(0,1fr);gap:2px 12px;margin:0;font:12px/1.5 var(--mono)}
.kv dt{color:var(--muted);overflow-wrap:anywhere}
.kv dd{margin:0;overflow-wrap:anywhere}
pre{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre+pre,.kv+pre,pre+.kv{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.jk{color:var(--dl)}.js{color:var(--ok)}.jn{color:var(--warn)}
.tr{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12px;height:22px}
.tr i{display:block;height:8px;border-radius:2px;background:var(--accent)}
.tr .ms{font:12px var(--mono);color:var(--muted);text-align:right}
footer{display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:11.5px;padding:7px 14px 9px}
footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:1499px){
main{--w2:max(360px,42vw);grid-template-columns:minmax(0,1fr) var(--w2);grid-template-rows:minmax(120px,var(--h2)) minmax(120px,1fr)}
.stage{grid-row:1/3}
.nodet main{grid-template-rows:minmax(0,1fr)}
.det .gut{left:0;right:0;top:-8px;bottom:auto;height:12px;width:auto;cursor:row-resize}
}
@media (max-width:899px){
main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.stage{grid-row:auto;height:calc(min(38dvh,(100vw - 28px) / var(--ar)) + 38px)}
.meta{flex:1 0 100%;order:1}
.x{display:none}
.log,.det{grid-area:2/1}
.gut{display:none}
.det{display:none}
.open .det{display:flex}
.open .log{display:none}
.back{display:block}
.bar{flex-wrap:wrap}
.bar input{flex:1 0 100%}
#keys{display:none}
}
.nolog main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.nolog .stage{grid-row:auto;height:auto}
.nolog .log,.nolog .det,.nolog .tl,.nolog .unfold{display:none}
.nolog #keys{display:inline}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header class="top"><h1>{{TITLE}}</h1><div class="meta" id="meta"></div><div class="dl" id="dl"></div></header>
<main>
<section class="stage"><div class="fit"><div class="v"><video controls playsinline preload="auto" src="{{VIDEO}}"></video>
{{LAYERS}}</div>
<div class="tl" id="tl"><div class="sm"></div><div class="ph"></div></div></div></section>
<section class="pane log" id="log"><div class="gut"></div></section>
<section class="pane det" id="det"><div class="gut"></div></section>
</main>
<button class="unfold" id="unfold" type="button"></button>
<footer><span id="foot"></span><span id="keys"></span></footer>
<script type="application/json" id="zn-data">{{DATA}}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("zn-data").textContent);
const L = (k) => D.strings[k] || k;
const B = document.body, v = document.querySelector("video");
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const btn = (cls, text, title, fn) => { const b = $("button", cls, text); b.type = "button"; if (title) b.title = title; b.onclick = fn; return b; };

// The video keeps its shape in whatever room there is; the marks: a layer each, shown in its time.
v.addEventListener("loadedmetadata", () => { if (v.videoWidth && v.videoHeight) document.documentElement.style.setProperty("--ar", v.videoWidth / v.videoHeight); });
const marks = [...document.querySelectorAll(".m")].map((e) => [e, e.dataset.t.split(";").map((s) => s.split(",").map(Number))]);
if (marks.length) (function f() { const t = v.currentTime; for (const [e, r] of marks) e.style.display = r.some(([a, b]) => t >= a && t < b) ? "block" : "none"; requestAnimationFrame(f); })();

// The header and the footer.
const meta = document.getElementById("meta");
for (const [k, val] of D.meta.rows) { const s = $("span"); s.append($("b", null, k + ": "), val); meta.append(s); }
if (D.meta.masked) meta.append($("span", "masked", D.meta.masked));
{ const f = document.getElementById("foot"); if (D.meta.rights) f.append(D.meta.rights, "  ·  "); if (D.meta.link) { const a = $("a", null, D.meta.foot); a.href = D.meta.link; a.target = "_blank"; a.rel = "noopener"; f.append(a); } else f.append(D.meta.foot || ""); }

const ev = D.events;
const log = document.getElementById("log"), det = document.getElementById("det");
B.dataset.rows = String(ev.length);
const keys = document.getElementById("keys");
if (!ev.length) { B.classList.add("nolog"); keys.textContent = L("report-no-log"); B.dataset.znimokReport = "ok"; return; }
keys.textContent = L("report-keys");

const kindOf = (e) => e.k === "console" || e.k === "log" ? "console" : ["error", "net", "ws", "dl", "click"].includes(e.k) ? e.k : e.k === "nav" || e.k === "tab" ? "nav" : "info";
const cls = (e) => e.k === "click" ? 5 : e.s === 2 ? 4 : e.s === 1 ? 3 : e.k === "dl" ? 2 : kindOf(e) === "nav" ? 1 : 0;
const CHIPS = [["devp-chip-all", () => true], ["devp-chip-errors", (e) => e.s === 2], ["devp-chip-warnings", (e) => e.s === 1],
  ["devp-chip-network", (e) => e.k === "net" || e.k === "ws"], ["devp-chip-console", (e) => ["console", "error"].includes(kindOf(e))],
  ["devp-chip-nav", (e) => kindOf(e) === "nav"], ["devp-chip-datalayer", (e) => e.k === "dl"], ["report-chip-clicks", (e) => e.k === "click"]];
const fmt = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(2); };
const oneLine = (s, n = 240) => { s = String(s == null ? "" : s).replace(/\s+/g, " "); return s.length > n ? s.slice(0, n) + "…" : s; };
const tail = (s) => { s = String(s || ""); const i = s.lastIndexOf("/"); return i >= 0 && i < s.length - 1 ? s.slice(i + 1) : s; };
const size = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
const url = (u) => { try { return new URL(u); } catch (x) { return null; } };
// console.log("%cText", "css"): the text without its styles, the other arguments in their places.
function said(e) {
  const a = Array.isArray(e.args) ? e.args : null;
  if (!a || typeof a[0] !== "string" || !/%[csdifoO]/.test(a[0])) return String(e.text != null ? e.text : "");
  let i = 1;
  const s = a[0].replace(/%([csdifoO%])/g, (m, c) => c === "%" ? "%" : c === "c" ? (i++, "") : i < a.length ? String(a[i++]) : m);
  return [s, ...a.slice(i)].join(" ");
}
function label(e) {
  switch (kindOf(e)) {
    case "net": return (e.method || "") + " " + (e.err ? "✕" : (e.status || "…"));
    case "ws": return e.dir === "out" ? "WS ↑" : "WS ↓";
    case "console": return e.lvl === "warning" ? "warn" : (e.lvl || "log");
    case "dl": return "dataLayer";
    case "click": return L("report-click");
    default: return e.k || "info";
  }
}
// What a row says: the main words and the quieter ones after them.
function message(e) {
  switch (kindOf(e)) {
    case "net": {
      const u = url(e.url), err = e.err ? " — " + e.err : "";
      if (!u || !u.host) return [oneLine(e.url) + err, ""];
      const p = u.pathname.replace(/\/+$/, ""), name = tail(p) + oneLine(u.search, 60);
      return [(name || u.host) + err, name ? u.host : ""];
    }
    case "ws": return [oneLine(e.data), ""];
    case "nav": return [oneLine(e.title || e.url), e.title ? oneLine(e.url) : ""];
    case "click": return [e.x + ", " + e.y, ""];
    case "dl": {
      let rest = e.data;
      if (rest && typeof rest === "object" && !Array.isArray(rest)) { rest = Object.assign({}, rest); delete rest.event; if (!Object.keys(rest).length) rest = null; }
      const r = rest == null ? "" : oneLine(JSON.stringify(rest));
      return e.ev ? [e.ev, r] : [r, ""];
    }
    default: return [oneLine(said(e) || e.url), ""];
  }
}
const source = (e) => e.k === "net" ? (e.dur != null ? Math.round(e.dur) + " ms" : "") : tail(e.src);
function matches(e, q) {
  if (!q) return true;
  const has = (x) => x != null && String(typeof x === "object" ? JSON.stringify(x) : x).toLowerCase().includes(q);
  if (e.k === "dl") return has(e.ev) || has(e.data);
  return has(e.text) || has(e.url) || has(e.title) || has(e.src) || has(e.postData) || has(e.data) || has(e.method) || (!e.b64 && has(e.body)) || has(e.status);
}

// The log: search, chips, the list.
const save = (name, data) => { const a = $("a", null, name); a.tabIndex = 0; a.onclick = () => { const u = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); const l = $("a"); l.href = u; l.download = name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }; return a; };
const dls = document.getElementById("dl");
dls.append(save("log.json", ev));
const dlOnly = ev.filter((e) => e.k === "dl");
if (dlOnly.length) dls.append(save("dataLayer.json", dlOnly.map((e) => ({ at: e.at, event: e.ev, data: e.data }))));
const bar = $("div", "bar"), search = $("input"), chips = $("div", "chips"), list = $("div", "list");
search.type = "search"; search.placeholder = L("devp-search");
// The panes: dragged wider or taller by their edges, folded away; the browser remembers.
const gutLog = log.querySelector(".gut"), gutDet = det.querySelector(".gut"), unfold = document.getElementById("unfold");
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (x) { /* no storage */ } };
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (x) { return null; } };
const lay = load("zn-layout") || {};
const wide = () => innerWidth >= 1500, mainEl = document.querySelector("main");
const applyLay = () => { for (const [k, v] of [["w2", wide() ? lay.w2 : lay.v2], ["w3", lay.w3], ["h2", lay.h2]]) mainEl.style.setProperty("--" + k, v ? v + "px" : ""); B.classList.toggle("fold", !!lay.fold); B.classList.toggle("nodet", !lay.fold && !!lay.nodet); unfold.textContent = lay.fold ? "⇤ " + L("report-log") : "⇤ " + L("report-tab-details"); };
applyLay();
addEventListener("resize", applyLay);
unfold.onclick = () => { lay.fold = false; lay.nodet = false; store("zn-layout", lay); applyLay(); };
for (const [g, pane] of [[gutLog, "log"], [gutDet, "det"]]) {
  g.onpointerdown = (k) => {
    // A pane's left edge dragged left makes it wider; the details' top edge dragged down makes
    // the list taller.
    const row = getComputedStyle(g).cursor === "row-resize", x0 = k.clientX, y0 = k.clientY;
    const w0 = (pane === "log" ? log : det).getBoundingClientRect().width, h0 = log.getBoundingClientRect().height;
    g.setPointerCapture(k.pointerId);
    g.onpointermove = (m) => {
      if (!g.hasPointerCapture(m.pointerId)) return;
      if (row) lay.h2 = Math.max(120, h0 + (m.clientY - y0));
      else lay[pane === "log" ? (wide() ? "w2" : "v2") : "w3"] = Math.min(innerWidth * 0.6, Math.max(300, w0 + (x0 - m.clientX)));
      applyLay();
    };
    g.onpointerup = () => { g.onpointermove = null; store("zn-layout", lay); };
  };
}
const foldBtn = btn("ib", "⇥", L("report-fold"), () => { lay.fold = true; store("zn-layout", lay); applyLay(); });
const chipEls = CHIPS.map(([k], i) => { const b = btn("chip", null, null, () => { chip = i; refilter(); }); chips.append(b); return b; });
bar.append(search, chips, foldBtn);
log.append(bar, list);

let chip = 0, shown = [], rows = [], sel = -1, cur = -1, pin = -1;
const tabOf = {};
function refilter() {
  const q = search.value.trim().toLowerCase();
  const inQ = ev.filter((e) => matches(e, q));
  chipEls.forEach((b, i) => {
    const n = inQ.filter(CHIPS[i][1]).length;
    b.textContent = L(CHIPS[i][0]); b.append($("b", null, n));
    b.classList.toggle("on", i === chip); b.hidden = !n && i > 0 && i !== chip;
  });
  shown = []; rows = [];
  ev.forEach((e, i) => { if (CHIPS[chip][1](e) && matches(e, q)) shown.push(i); });
  list.textContent = "";
  if (!shown.length) list.append($("div", "empty", L("devp-empty")));
  for (const i of shown) {
    const e = ev[i], c = cls(e), [main, dim] = message(e);
    const r = $("div", "row fut"), m = $("span", "msg" + (c === 4 ? " c4" : ""), main);
    r.dataset.i = i;
    if (dim) m.append($("i", null, dim));
    r.append($("span", "tm", fmt(e.at)), $("span", "kd c" + c, label(e)), m, $("span", "src", source(e)));
    if (i === sel) r.classList.add("sel");
    rows.push(r); list.append(r);
  }
  cur = -1; follow(false);
  B.dataset.shown = String(shown.length);
}
search.oninput = refilter;
list.onclick = (k) => { const r = k.target.closest(".row"); if (r) pick(Number(r.dataset.i)); };

// Where the video is in the list: one thin mark on the last event that has happened, the ones
// still to come are quieter. A picked event holds the mark while the video stands on its time
// (many events share a moment — the mark must not sit on a neighbour).
function follow(scroll) {
  const t = v.currentTime + 0.001;
  let lo = 0, hi = shown.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (ev[shown[m]].at <= t) lo = m + 1; else hi = m; }
  let n = lo - 1;
  if (pin >= 0) { const p = shown.indexOf(pin); if (Math.abs(ev[pin].at - v.currentTime) > 0.06) pin = -1; else if (p >= 0) n = p; }
  if (n === cur) return;
  if (rows[cur]) rows[cur].classList.remove("cur");
  for (let i = Math.min(cur, n) + 1; i <= Math.max(cur, n); i++) if (rows[i]) rows[i].classList.toggle("fut", i > n);
  cur = n;
  if (rows[cur]) { rows[cur].classList.add("cur"); if (scroll) rows[cur].scrollIntoView({ block: "nearest" }); }
}
v.addEventListener("timeupdate", () => follow(!v.paused));
v.addEventListener("seeked", () => follow(false));

// The strip under the video: a tick per event (a dot per click), the playhead, the picked event.
const tl = document.getElementById("tl"), ph = tl.querySelector(".ph"), sm = tl.querySelector(".sm");
const dur = () => (isFinite(v.duration) && v.duration > 0) ? v.duration : Math.max(1, ...ev.map((e) => e.at));
const pos = (t) => (Math.min(1, Math.max(0, t / dur())) * 100) + "%";
