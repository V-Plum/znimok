<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f7;--panel:#fff;--soft:#f0f2f6;--line:#dde0e7;--fg:#15171c;--fg2:#3d424d;--muted:#6a707d;--accent:#2f6fed;--sel:#dfe9ff;
--err:#d0343a;--warn:#a86400;--dl:#7446d8;--nav:#2f6fed;--net:#5a606d;--click:#b98700;--ok:#1f8a4c;--mono:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;--ar:calc({{VW}} / {{VH}});
--w2:max(360px,26vw);--w3:max(380px,30vw);--h2:50%}
@media (prefers-color-scheme:dark){:root{--bg:#0e1014;--panel:#16191f;--soft:#1d2129;--line:#2a2f39;--fg:#e9ebef;--fg2:#c3c7cf;--muted:#8f96a3;--accent:#74a2ff;--sel:#223355;
--err:#ff6b70;--warn:#f0a431;--dl:#ae7bff;--nav:#74a2ff;--net:#9aa1ad;--click:#f2c230;--ok:#4cc27d}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.top{display:flex;align-items:baseline;gap:6px 16px;padding:10px 14px 8px}
h1{font-size:16px;margin:0;font-weight:650;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.masked{color:var(--warn)}
/* The panes and the dividers between them (ZK-257): a divider is dragged to resize the pane to
   its right, its button folds that pane away and brings it back — smoothly. */
main{display:grid;gap:0;padding:0 14px;min-height:0;grid-template-columns:minmax(0,1fr) 14px var(--w2) 14px var(--w3);grid-template-rows:minmax(0,1fr);transition:grid-template-columns .28s ease,grid-template-rows .28s ease}
.drag main,.drag .pane{transition:none!important}
.stage{grid-area:1/1}.d1{grid-area:1/2}.log{grid-area:1/3}.d2{grid-area:1/4}.det{grid-area:1/5}
.dv{position:relative;cursor:col-resize;touch-action:none;display:flex;justify-content:center;min-width:0;min-height:0}
.dv::before{content:"";position:absolute;top:36px;bottom:4px;left:50%;width:2px;margin-left:-1px;border-radius:1px;background:var(--line);transition:background .15s}
.dv:hover::before,.drag .dv::before{background:var(--accent)}
.fb{position:relative;z-index:1;margin-top:4px;width:22px;height:28px;border-radius:7px;background:var(--panel);border:1px solid var(--line);color:var(--fg2);font-size:15px;line-height:1}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.pane{transition:opacity .2s}
.pane.shut{opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .28s}
/* What the header said, under the video, where the room is. */
.stage{container-type:size;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;width:min(100cqw,calc((100cqh - 46px - var(--ih,0px)) * var(--ar)))}
.fit{display:grid;gap:8px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 20px;font-size:12.5px;overflow:auto;max-height:45cqh}
.info .f{min-width:0}
.info .f>b{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:1px}
.info .f>span{overflow-wrap:anywhere}
.info .wide{grid-column:1/-1}
.info .note{color:var(--muted);font-size:12px}
.info a{color:var(--accent);text-decoration:none;cursor:pointer}
.files{display:flex;flex-wrap:wrap;gap:2px 14px;white-space:nowrap}
footer a{color:var(--accent);text-decoration:none}
.v{position:relative;line-height:0;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:var(--ar)}
video{width:100%;height:100%;display:block}
.m{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.tl{position:relative;height:30px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;touch-action:none}
.tk{position:absolute;top:6px;width:2px;height:16px;margin-left:-1px;background:currentColor;opacity:.8;border-radius:1px}
.tk.c5{top:10px;width:8px;height:8px;margin-left:-4px;border-radius:4px;opacity:1}
.ph,.sm{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none}
.sm{width:10px;margin-left:-5px;background:var(--accent);opacity:.28;display:none}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.bar input{flex:0 1 130px;min-width:84px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.chips{display:flex;gap:4px;overflow:hidden;flex:1;min-width:0}
.chip.over{display:none}
.chip{flex:none;border-radius:11px;padding:2px 9px;background:var(--soft);color:var(--fg2);font-weight:600;font-size:12px;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-left:5px}
.chip.on{background:var(--sel);color:var(--fg)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain;padding:2px 0}
.row{display:grid;grid-template-columns:66px 74px minmax(0,1fr) auto;gap:8px;padding:0 10px 0 7px;height:26px;align-items:center;cursor:pointer;border-left:3px solid transparent;outline-offset:-2px}
.row>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:var(--soft)}
.row.fut{color:var(--muted)}
.row.fut .kd,.row.fut .msg{opacity:.62}
.row.cur{border-left-color:var(--accent)}
.row.sel,.row.sel:hover{background:var(--sel)}
.tm{font:11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row.cur .tm{color:var(--accent)}
.kd{font-size:11.5px;font-weight:650}
.msg i,.ttl i{font-style:normal;color:var(--muted);margin-left:8px}
.src{font-size:11.5px;color:var(--muted);max-width:120px}
.row.gone{color:var(--muted);text-decoration:line-through;cursor:default;opacity:.7}
.row.new .tm::before{content:"+ ";color:var(--ok);font-weight:700}
.row.moved .tm::before{content:"↕ ";color:var(--warn);font-weight:700}
.row.gone .tm::before{content:"− ";color:var(--err);font-weight:700}
.dif{color:var(--warn);font-weight:600}.dif.bad{color:var(--err)}.dif.good{color:var(--ok)}
.cmp{display:none;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px;background:var(--soft)}
.cmp span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp.on{display:flex}
.menu{position:absolute;z-index:4;top:38px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0004;min-width:260px;max-width:360px;padding:4px;display:none}
.menu.on{display:block}
.menu button{display:flex;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:12.5px;align-items:center}
.menu button:hover{background:var(--soft)}
.menu button b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.menu button i{font-style:normal;color:var(--muted);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .del{width:auto;padding:2px 6px;color:var(--muted)}
.c4{color:var(--err)}.c3{color:var(--warn)}.c2{color:var(--dl)}.c1{color:var(--nav)}.c0{color:var(--net)}.c5{color:var(--click)}
.empty{padding:18px 14px;color:var(--muted);text-align:center;margin:auto}
.dhead{display:flex;gap:8px;align-items:center;padding:0 6px 0 10px;height:41px;border-bottom:1px solid var(--line);flex:none}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ib{flex:none;min-width:28px;height:28px;padding:0 7px;border-radius:7px;color:var(--fg2);font-size:12px}
.ib:hover{background:var(--soft)}
.back{display:none}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{flex:none;color:var(--muted);padding:4px 9px 6px;font-weight:600;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab:disabled{opacity:.4;cursor:default}
.body{flex:1;overflow:auto;min-height:0;padding:10px 12px;overscroll-behavior:contain}
.body h3{margin:12px 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
.body h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:min(38%,190px) minmax(0,1fr);gap:2px 12px;margin:0;font:12px/1.5 var(--mono)}
.kv dt{color:var(--muted);overflow-wrap:anywhere}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a,.body a{color:var(--accent);text-decoration:none}
.phe{margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.phe h4{margin:0 0 4px;font:600 12.5px system-ui,sans-serif;display:flex;gap:8px}
.phe h4 i{font-style:normal;color:var(--muted);font-weight:400;margin-left:auto;font:11.5px var(--mono)}
pre{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre+pre,.kv+pre,pre+.kv{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.jk{color:var(--dl)}.js{color:var(--ok)}.jn{color:var(--warn)}
.tr{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12px;height:22px}
.tr i{display:block;height:8px;border-radius:2px;background:var(--accent)}
.tr .ms{font:12px var(--mono);color:var(--muted);text-align:right}
footer{display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:11.5px;padding:7px 14px 9px}
footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:1499px){
main{--w2:max(360px,42vw);grid-template-columns:minmax(0,1fr) 14px var(--w2);grid-template-rows:minmax(0,var(--h2)) 14px minmax(0,1fr)}
.stage{grid-area:1/1/4/2}.d1{grid-area:1/2/4/3}.log{grid-area:1/3}.d2{grid-area:2/3}.det{grid-area:3/3}
.d2{cursor:row-resize;justify-content:flex-start;align-items:center}
.d2::before{top:50%;bottom:auto;left:36px;right:4px;width:auto;height:2px;margin:-1px 0 0}
.d2 .fb{margin:0 0 0 4px;width:28px;height:22px}
.fd main{grid-template-rows:minmax(0,1fr) 14px 0px}
.fl .d2{visibility:hidden}
}
@media (max-width:899px){
main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);row-gap:10px}
.stage{grid-area:1/1;container-type:inline-size}
.col{width:100%}
.fit{width:min(100%,calc(38dvh * var(--ar)));margin:0 auto}
.info{max-height:24dvh}
.x{display:none}
.log,.det{grid-area:2/1}
.dv{display:none}
.det{display:none}
.open .det{display:flex}
.open .log{display:none}
.back{display:block}
.bar{flex-wrap:wrap}
.bar input{flex:1 0 100%}
#keys{display:none}
}
.nolog main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.nolog .stage{grid-area:1/1}
.nolog .log,.nolog .det,.nolog .tl,.nolog .dv{display:none}
.nolog #keys{display:inline}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header class="top"><h1>{{TITLE}}</h1></header>
<main>
<section class="stage"><div class="col"><div class="fit"><div class="v"><video controls playsinline preload="auto" src="{{VIDEO}}"></video>
{{LAYERS}}</div>
<div class="tl" id="tl"><div class="sm"></div><div class="ph"></div></div></div>
<div class="info" id="info"></div></div></section>
<div class="dv d1" id="d1"></div>
<section class="pane log" id="log"></section>
<div class="dv d2" id="d2"></div>
<section class="pane det" id="det"></section>
</main>
<footer><span id="foot"></span><span id="keys"></span></footer>
<script type="application/json" id="zn-data">{{DATA}}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("zn-data").textContent);
const L = (k) => D.strings[k] || k;
const B = document.body, v = document.querySelector("video");
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// The video keeps its shape in whatever room there is; the marks: a layer each, shown in its time.
v.addEventListener("loadedmetadata", () => { if (v.videoWidth && v.videoHeight) document.documentElement.style.setProperty("--ar", v.videoWidth / v.videoHeight); });
const marks = [...document.querySelectorAll(".m")].map((e) => [e, e.dataset.t.split(";").map((s) => s.split(",").map(Number))]);
if (marks.length) (function f() { const t = v.currentTime; for (const [e, r] of marks) e.style.display = r.some(([a, b]) => t >= a && t < b) ? "block" : "none"; requestAnimationFrame(f); })();

// The facts of the recording, under the video (ZK-257: the header kept them in one crowded

const info = document.getElementById("info"), stageEl = document.querySelector(".stage");
const link = (href, text) => { const a = $("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.title = href; return a; };

  const f = $("div", "f" + (wide ? " wide" : "")), s = $("span");

};
let pageRow = null, pageKey = L("report-page");
for (const [k, val] of D.meta.rows) { if (/^https?:\/\/\S+$/.test(val)) { pageKey = k; pageRow = fact(k, link(val, val), true); } else fact(k, val, String(val).length > 34); }
if (D.meta.masked) info.append($("div", "f wide masked", D.meta.masked));
const rightsEl = D.meta.rights ? info.appendChild($("div", "f wide note", D.meta.rights)) : null;
new ResizeObserver(() => { const h = Math.round(info.offsetHeight); if (Math.abs(h - (stageEl._ih || 0)) > 2) { stageEl._ih = h; stageEl.style.setProperty("--ih", h + "px"); } }).observe(info);
{ const f = document.getElementById("foot"); if (D.meta.link) f.append(link(D.meta.link, D.meta.foot)); else f.append(D.meta.foot || ""); }

const ev = D.events;
const log = document.getElementById("log"), det = document.getElementById("det");
B.dataset.rows = String(ev.length);
const keys = document.getElementById("keys");
if (!ev.length) { B.classList.add("nolog"); keys.textContent = L("report-no-log"); B.dataset.znimokReport = "ok"; return; }
keys.textContent = L("report-keys");

const kindOf = (e) => e.k === "console" || e.k === "log" ? "console" : ["error", "net", "ws", "dl", "click"].includes(e.k) ? e.k : e.k === "nav" || e.k === "tab" ? "nav" : "info";
const cls = (e) => e.k === "click" ? 5 : e.s === 2 ? 4 : e.s === 1 ? 3 : e.k === "dl" ? 2 : kindOf(e) === "nav" ? 1 : 0;
const CHIPS = [["devp-chip-all", () => true], ["devp-chip-errors", (e) => e.s === 2], ["devp-chip-warnings", (e) => e.s === 1],
  ["devp-chip-network", (e) => e.k === "net" || e.k === "ws"], ["devp-chip-console", (e) => ["console", "error"].includes(kindOf(e))],
  ["devp-chip-nav", (e) => kindOf(e) === "nav"], ["devp-chip-datalayer", (e) => e.k === "dl"], ["report-chip-clicks", (e) => e.k === "click"], ["report-chip-posthog", (e) => isPH(e)]];

const isPH = (e) => e.k === "net" ? /posthog/i.test(e.url) || /^\/(i\/v0\/e|batch|capture|decide|flags)\/?$/.test((url(e.url) || {}).pathname || "") : kindOf(e) === "console" && /posthog/i.test(e.src || "");
const phKind = (e) => { const p = (url(e.url) || {}).pathname || ""; return /\/(flags|decide)\/?$/.test(p) ? "flags" : /\/s\/?$/.test(p) ? "replay" : "events"; };
const HIDE = (D.meta.hide_keys || []).map((k) => k.toLowerCase());
const hideKey = (k) => HIDE.some((h) => k.toLowerCase().includes(h));
function masked(v) {
  if (!HIDE.length) return v;
  if (Array.isArray(v)) return v.map(masked);
  if (v && typeof v === "object") { const o = {}; for (const k of Object.keys(v)) o[k] = hideKey(k) ? "•••" : masked(v[k]); return o; }

  return v;
}
const gunzip = (str) => new Response(new Blob([Uint8Array.from(str, (c) => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
async function decode(e) {

  const j = JSON.parse(t), m = masked(j);
  e._ph = m; e._dec = HIDE.length ? JSON.stringify(m) : t;
}
const phBatch = (e) => { const p = e._ph; return Array.isArray(p) ? p : p && Array.isArray(p.batch) ? p.batch : p && p.event ? [p] : []; };
function phSummary(e) {
  const k = phKind(e);
  if (k === "flags") { let f = null; try { f = JSON.parse(e.body).flags || JSON.parse(e.body).featureFlags; } catch (x) { /* no flags */ } if (!f) return ""; const all = Object.values(f); return L("report-ph-flags").replace("{n}", all.length).replace("{on}", all.filter((x) => x === true || (x && typeof x === "object" ? x.enabled : typeof x === "string")).length); }
  const b = phBatch(e);
  if (!b.length) return "";
  if (k === "replay") return L("report-ph-replay").replace("{n}", b.reduce((n, x) => n + (((x.properties || {}).$snapshot_data || []).length || 1), 0));
  const count = new Map(); for (const x of b) count.set(x.event, (count.get(x.event) || 0) + 1);
  return [...count].map(([n, c]) => n + (c > 1 ? " ×" + c : "")).join(", ");
}
// The search: words, -words, and status:5xx · method:post · host:posthog · type:xhr · dur>300.
function terms(q) {
  return q.split(/\s+/).filter(Boolean).map((w) => { const neg = w[0] === "-", x = neg ? w.slice(1) : w, m = x.match(/^(status|method|host|type|dur)([:<>])(.+)$/); return m ? { neg, op: m[1], cmp: m[2], v: m[3] } : { neg, text: x }; });
}
function term(e, t) {
  if (t.text != null) return matches(e, t.text);
  const u = url(e.url);
  if (t.op === "status") { const st = String(e.status || ""); return t.v.endsWith("xx") ? st[0] === t.v[0] : st === t.v; }
  if (t.op === "method") return (e.method || "").toLowerCase() === t.v;
  if (t.op === "host") return !!u && u.host.includes(t.v);
  if (t.op === "type") return ((e.type || "") + " " + (e.mime || "")).toLowerCase().includes(t.v);
  return e.dur != null && (t.cmp === "<" ? e.dur < +t.v : e.dur > +t.v);
}
const fmt = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(2); };
const oneLine = (s, n = 240) => { s = String(s == null ? "" : s).replace(/\s+/g, " "); return s.length > n ? s.slice(0, n) + "…" : s; };
const tail = (s) => { s = String(s || ""); const i = s.lastIndexOf("/"); return i >= 0 && i < s.length - 1 ? s.slice(i + 1) : s; };
const size = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
const url = (u) => { try { return new URL(u); } catch (x) { return null; } };
// console.log("%cText", "css"): the text without its styles, the other arguments in their places.
function said(e) {
  const a = Array.isArray(e.args) ? e.args : null;
  if (!a || typeof a[0] !== "string" || !/%[csdifoO]/.test(a[0])) return String(e.text != null ? e.text : "");
