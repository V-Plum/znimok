[package]
name = "znimok-thumbnail"
description = "Thumbnails of .znimok files in Windows Explorer — an IThumbnailProvider COM DLL (per-user registration, isolated process, reads only the stored thumbnail)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# cdylib: the DLL Explorer loads; staticlib: linked into the macOS Quick Look extension;
# rlib: tests call the same code in-process.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
znimok-format = { path = "../znimok-format" }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
znimok-core = { path = "../znimok-core" }
