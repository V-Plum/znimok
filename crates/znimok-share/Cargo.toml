[package]
name = "znimok-share"
description = "Sharing targets of Znimok (ZK-101): a screenshot, a recording or a report sent to Telegram, Jira, Slack, Redmine or a webhook over the OS HTTP stack, with a connection check per target and a queue on disk that retries"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
znimok-google = { path = "../znimok-google" }
znimok-models = { path = "../znimok-models" }
znimok-settings = { path = "../znimok-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
