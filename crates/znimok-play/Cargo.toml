[package]
name = "znimok-play"
description = "Video playback for the editor (ZK-92): the recording decoded on the GPU (Media Foundation D3D11 → shared NV12 texture on Windows, VideoToolbox → IOSurface planes on macOS) and converted by a wgpu pass into an RGBA texture on the application's own device — no frame crosses the CPU; exact seeks, reverse through a cache of the key-frame interval, speeds, film-strip thumbnails, a CPU copy of the paused frame"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
znimok-core = { path = "../znimok-core" }
znimok-format = { path = "../znimok-format" }
znimok-video = { path = "../znimok-video" }
wgpu = "30"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-metal = "0.3"

[target.'cfg(windows)'.dev-dependencies]
znimok-video-win = { path = "../znimok-video-win" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }
