[package]
name = "znimok-app"
description = "Znimok — the application: library, editor, capture"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "znimok-app"
path = "src/main.rs"

[dependencies]
znimok-core = { path = "../znimok-core" }
znimok-format = { path = "../znimok-format" }
znimok-agents = { path = "../znimok-agents" }
znimok-models = { path = "../znimok-models" }
znimok-update = { path = "../znimok-update" }
znimok-codes = { path = "../znimok-codes", features = ["encode"] }
znimok-stitch = { path = "../znimok-stitch" }
znimok-render = { path = "../znimok-render" }
znimok-platform = { path = "../znimok-platform" }
znimok-gpu = { path = "../znimok-gpu" }
znimok-i18n = { path = "../znimok-i18n" }
znimok-log = { path = "../znimok-log" }
znimok-video = { path = "../znimok-video" }
znimok-play = { path = "../znimok-play" }
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030", "system-tray"] }
png = "0.18"
global-hotkey = "0.8"
znimok-settings = { path = "../znimok-settings" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# WebP with a quality (ZK-197): libwebp, built from its C source by libwebp-sys (BSD-3-Clause).
webp = { version = "0.3", default-features = false }
rfd = "0.17"
arboard = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
redb = "4"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
znimok-win = { path = "../znimok-win" }
znimok-video-win = { path = "../znimok-video-win" }
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Graphics_Imaging", "Win32_System_Registry", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
znimok-mac = { path = "../znimok-mac" }
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
embed-resource = "3"
slint-build = "~1.18"
znimok-i18n = { path = "../znimok-i18n" }

[dev-dependencies]
# UI tests without a window or GPU (ZK-33); the same version as slint.
i-slint-backend-testing = "=1.18.1"
