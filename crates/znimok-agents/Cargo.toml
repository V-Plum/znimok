[package]
name = "znimok-agents"
description = "Znimok for AI agents — MCP server (both the 2025-11-25 handshake and the stateless 2026-07-28 protocol), tools over the command layer, GUI proxy through IPC or headless work, and the agent permission model with an audit log"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
znimok-core = { path = "../znimok-core" }
znimok-format = { path = "../znimok-format" }
znimok-render = { path = "../znimok-render" }
znimok-models = { path = "../znimok-models" }
znimok-mask = { path = "../znimok-mask" }
znimok-platform = { path = "../znimok-platform" }
znimok-settings = { path = "../znimok-settings" }
znimok-ipc = { path = "../znimok-ipc" }
znimok-html = { path = "../znimok-html" }
znimok-report = { path = "../znimok-report" }
znimok-export = { path = "../znimok-export" }
znimok-play = { path = "../znimok-play" }
znimok-i18n = { path = "../znimok-i18n" }
znimok-codes = { path = "../znimok-codes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"

[dev-dependencies]
# A QR code on a test document (read_codes).
znimok-codes = { path = "../znimok-codes", features = ["encode"] }

[target.'cfg(windows)'.dependencies]
znimok-win = { path = "../znimok-win" }

[target.'cfg(target_os = "macos")'.dependencies]
znimok-mac = { path = "../znimok-mac" }
