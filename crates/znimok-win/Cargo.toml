[package]
name = "znimok-win"
description = "Windows implementations of the Znimok platform traits — capture (WGC Borderless, FP16 / DXGI Desktop Duplication), window list with DWM bounds, cursor, autostart (HKCU Run), clipboard, share"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
znimok-platform = { path = "../znimok-platform" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(windows)'.dev-dependencies]
png = "0.18"
